<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff2f86"><title>Afiliados IA</title><style>:root{--p:#ff2f86;--i:#111;--m:#777;--l:#ececec;--bg:#fafafa}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--i)}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid var(--l);padding:24px 16px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:900;padding:8px 12px 28px}.brand span{color:var(--p)}nav button{width:100%;border:0;background:transparent;text-align:left;padding:13px 12px;border-radius:12px;margin:3px 0;font-weight:700;color:#555}nav button.active,nav button:hover{background:#111;color:#fff}.main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:30px}.status{font-size:13px;color:var(--m)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 5px 20px #1111}.metric b{display:block;font-size:28px;margin-top:8px}.metric small{color:var(--m)}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{display:flex;flex-direction:column;gap:12px}.pic{height:150px;border-radius:14px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;color:#aaa;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#fff0f6;color:#d51d69;font-weight:800;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:#111;color:#fff}.pink{background:var(--p)}.light{background:#f3f3f3;color:#111}.input{border:1px solid #ddd;background:#fff;border-radius:12px;padding:11px 13px;outline:none;width:100%}.search{display:flex;gap:8px;max-width:650px}.search .input{flex:1}.score{font-size:25px;font-weight:900}.score span{color:var(--p)}.view{display:none}.view.active{display:block}.empty{padding:35px;text-align:center;color:#777;border:1px dashed #ddd;border-radius:16px}.bottom{display:none}@media(max-width:900px){.side{display:none}.main{margin:0;width:100%;padding:18px 16px 90px}.grid{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:1fr 1fr}.bottom{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);justify-content:space-around;padding:8px}.bottom button{border:0;background:transparent;font-size:11px;font-weight:800;padding:6px}.bottom button.active{color:var(--p)}}@media(max-width:560px){.products{grid-template-columns:1fr}.grid{gap:10px}.metric{padding:15px}.metric b{font-size:23px}}</style></head><body><div class="app"><aside class="side"><div class="brand">Afiliados <span>IA</span></div><nav id="nav"></nav></aside><main class="main"><div class="top"><div><div class="status" id="status">Verificando conexões...</div><h1 id="title">Início</h1></div><button class="btn pink" onclick="show('products')">+ Produto</button></div><section id="home" class="view active"></section><section id="products" class="view"></section><section id="create" class="view"></section><section id="charts" class="view"></section><section id="library" class="view"></section><section id="settings" class="view"></section></main></div><div class="bottom" id="bottom"></div><script>const state={view:"home",products:[],library:[],connected:{}};const labels={home:"Início",products:"Produtos",create:"Criar",charts:"Gráficos",library:"Biblioteca",settings:"Configurações"},icons={home:"⌂",products:"▦",create:"✦",charts:"◒",library:"▤",settings:"⚙"};function nav(){let h=Object.keys(labels).map(k=>`<button class="${state.view===k?"active":""}" onclick="show('${k}')">${icons[k]} &nbsp; ${labels[k]}</button>`).join("");document.getElementById("nav").innerHTML=h;document.getElementById("bottom").innerHTML=h}function show(v){state.view=v;document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v).classList.add("active");document.getElementById("title").textContent=labels[v];nav();render()}async function health(){try{let d=await(await fetch("/api/health")).json();state.connected=d.integrations;document.getElementById("status").textContent=Object.values(d.integrations).some(Boolean)?"Conexões ativas":"Conecte suas plataformas em Configurações"}catch{document.getElementById("status").textContent="Servidor indisponível"}}async function load(){try{let r=await fetch("/api/mercadolivre/trends"),a=await r.json();if(!r.ok)throw 0;state.products=a.slice(0,20).map((x,i)=>({title:x.keyword,url:x.url,score:Math.max(40,96-i*2),source:"Mercado Livre"}));render()}catch{}}function card(p,i){return '<article class="card product"><div class="pic">'+(p.thumbnail?'<img src="'+p.thumbnail+'">':"Sem imagem")+'</div><div class="row"><span class="pill">Mercado Livre</span><span class="pill">Tendência</span></div><strong>'+esc(p.title)+'</strong><div class="score"><span>'+p.score+'</span>/100</div><div class="row"><button class="btn" onclick="createFrom('+i+')">Criar conteúdo</button>'+(p.permalink?'<a class="btn light" target="_blank" href="'+p.permalink+'">Abrir</a>':"")+"</div></article>"}function home(){document.getElementById("home").innerHTML='<div class="grid"><div class="card metric"><small>Produtos carregados</small><b>'+state.products.length+'</b></div><div class="card metric"><small>Conexões</small><b>'+Object.values(state.connected).filter(Boolean).length+'/3</b></div><div class="card metric"><small>Conteúdos salvos</small><b>'+state.library.length+'</b></div><div class="card metric"><small>Score médio</small><b>'+ (state.products.length?Math.round(state.products.reduce((a,p)=>a+p.score,0)/state.products.length):"—")+"</b></div></div><div class=section><div class=sectionhead><h2>Oportunidades reais</h2><button class='btn light' onclick='load()'>Atualizar</button></div><div class=products>"+(state.products.length?state.products.slice(0,6).map(card).join(""):'<div class=empty>Conecte o Mercado Livre e carregue tendências reais.</div>')+"</div></div>"}function products(){document.getElementById("products").innerHTML='<div class=search><input id=q class=input placeholder="Buscar produto no Mercado Livre"><button class="btn pink" onclick="searchML()">Buscar</button></div><div class=section><div class=products>'+(state.products.length?state.products.map(card).join(""):'<div class=empty>Nenhum produto carregado.</div>')+"</div></div>"}async function searchML(){let q=document.getElementById("q").value.trim();if(!q)return;let r=await fetch("/api/mercadolivre/search?q="+encodeURIComponent(q)),d=await r.json();if(!r.ok)return alert(d.error||"Não foi possível buscar.");state.products=(d.results||[]).map((p,i)=>({title:p.title,thumbnail:p.thumbnail,permalink:p.permalink,price:p.price,original_price:p.original_price,score:80-i}));products()}function createFrom(i){state.current=state.products[i];show("create")}function create(){let p=state.current;document.getElementById("create").innerHTML='<div class=card><h2>Gerar conteúdo</h2><p class=status>A IA usa somente dados reais disponíveis.</p><input class=input id=cp value="'+esc(p?.title||"")+'"><div class=section><div class=row><select class=input id=channel><option>WhatsApp</option><option>Instagram</option><option>TikTok</option><option>Facebook</option><option>Shorts</option></select><select class=input id=kind><option>Legenda promocional</option><option>Mensagem de grupo</option><option>Roteiro curto</option><option>Título e descrição</option></select></div></div><button class="btn pink" onclick="generate()">Gerar com IA</button><div class=section id=result></div></div>'}async function generate(){let p=state.current,r=await fetch("/api/content",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product:p,channel:channel.value,kind:kind.value})}),d=await r.json();if(!r.ok)return alert(d.error||"IA não conectada.");let t=JSON.stringify(d,null,2);state.library.unshift({product:p.title,text:t,date:new Date().toLocaleString("pt-BR")});localStorage.setItem("library",JSON.stringify(state.library));document.getElementById("result").innerHTML='<div class=card><pre style="white-space:pre-wrap">'+esc(t)+'</pre><button class=btn onclick="navigator.clipboard.writeText('+JSON.stringify(t)+')">Copiar</button></div>'}function charts(){document.getElementById("charts").innerHTML='<div class=grid><div class="card metric"><small>Cliques</small><b>—</b></div><div class="card metric"><small>Vendas</small><b>—</b></div><div class="card metric"><small>Comissões</small><b>—</b></div><div class="card metric"><small>Conversão</small><b>—</b></div></div><div class="card section"><h2>Relatórios</h2><p class=status>Sem números fictícios. As métricas entram pelas integrações reais.</p></div>'}function library(){document.getElementById("library").innerHTML=state.library.length?state.library.map(x=>'<div class="card section"><strong>'+esc(x.product)+'</strong><p class=status>'+esc(x.date)+'</p><pre style="white-space:pre-wrap">'+esc(x.text)+'</pre></div>').join(""):'<div class=empty>Sua biblioteca aparecerá aqui.</div>'}function settings(){document.getElementById("settings").innerHTML='<div class=card><h2>Conexões</h2><p class=status>Credenciais ficam no servidor.</p><div class="card section"><strong>Mercado Livre</strong><p>'+ (state.connected.mercadoLivre?"Conectado":"Não conectado")+'</p><p class=status>Configure ML_ACCESS_TOKEN no ambiente do servidor.</p></div><div class="card section"><strong>Shopee</strong><p>'+ (state.connected.shopee?"Conectado":"Não conectado")+'</p><p class=status>Configure SHOPEE_API_URL e SHOPEE_API_KEY com a API oficial da sua conta.</p></div><div class="card section"><strong>IA</strong><p>'+ (state.connected.ai?"Conectada":"Não conectada")+'</p><p class=status>Configure AI_API_URL e AI_API_KEY.</p></div></div>'}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function render(){home();products();create();charts();library();settings()}state.library=JSON.parse(localStorage.getItem("library")||"[]");nav();health();render();</script></body></html>
