name: Build Choose Plan APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        run: |
          mkdir extracted
          unzip -q "ChoosePlan_Pronto_para_GitHub_Actions.zip" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Separar APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ChoosePlan.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ChoosePlan-APK
          path: ChoosePlan.apk
